<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>加入我们 - AzureDream</title>
    <link rel="preload" href="fonts/PowerGrotesk-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/MiSans-ExtraLight.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="pv-wrapper">
        <div class="pv-max">
            <div class="glass">

                <div class="header">
                    <div class="logo-container">
                        <img src="images/logo.png" alt="AzureDream Logo" class="logo-img">
                        <h1 class="title" style="font-size: 24px;">AzureDream</h1>
                    </div>

                    <nav class="nav-links">
                        <a href="index.html">主页</a>
                        <a href="about.html">简介</a>
                        <a href="join.html" class="active">加入</a>
                        <a href="hall-of-fame.html">名人堂</a>
                        <a href="staff.html">团队</a>
                    </nav>
                </div>

                <div class="hero" style="min-height: auto; padding-bottom: 20px;">
                    <div class="hero-content">
                        <h2>加入 AzureDream</h2>
                        <p>开启你的 AI 驱动 Minecraft 之旅</p>
                    </div>
                </div>

                <div class="cards">

                    <div class="card">
                        <div class="meta">
                            <span>第一步 · QQ Group</span>
                        </div>
                        <h3>加入 QQ 群</h3>
                        <p class="desc">群号：974782827</p>
                        <a href="https://qm.qq.com/q/yTFgbREpDW" class="btn" target="_blank">点击加群</a>
                    </div>

                    <div class="card">
                        <div class="meta">
                            <span>第二步 · Rules</span>
                        </div>
                        <h3>阅读群规</h3>
                        <p class="desc">在加入前，请仔细阅读群内的规则公告，以获得最佳游戏体验。遵守规则是社区和谐的基础。</p>
                    </div>

                    <div class="card">
                        <div class="meta">
                            <span>第三步 · Connect</span>
                        </div>
                        <h3>连接服务器</h3>
                        <p class="desc">服务器地址：<strong id="server-address"
                                style="color:var(--text-1);">miku.click:10669</strong></p>
                        <button id="copy-btn" class="btn btn-secondary">复制地址</button>
                    </div>

                </div>

                <div class="footer">
                    <div class="copyright">Copyright © 2025 AzureDream All rights reserved.</div>
                    <a href="https://www.netlify.com" target="_blank" rel="noopener noreferrer" class="netlify-link">
                        <img src="images/Netlify_logo_.svg" alt="Netlify" width="30" height="12">
                        Powered by Netlify
                    </a>
                </div>

            </div>
        </div>
    </div>
    <script>
        document.getElementById('copy-btn').addEventListener('click', function () {
            const address = document.getElementById('server-address').innerText;
            navigator.clipboard.writeText(address).then(() => {
                const originalText = this.innerText;
                this.innerText = '已复制!';
                setTimeout(() => {
                    this.innerText = originalText;
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        });
    </script>
</body>

</html>
