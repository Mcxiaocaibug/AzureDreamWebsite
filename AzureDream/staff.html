    <title>管理团队 - AzureDream</title>
    <link rel="preload" href="fonts/PowerGrotesk-Regular.woff2" as="font" type="font/woff2" crossorigin>

<body>
    <div class="pv-wrapper">
        <div class="pv-max">
            <div class="glass">

                <div class="header">
                    <div class="logo-container">
                        <img src="images/logo.png" alt="AzureDream Logo" class="logo-img">

                    <nav class="nav-links">

                    </nav>
                </div>

                <div class="hero" style="min-height: auto; padding-bottom: 20px;">
                    <div class="hero-content">
                        <h2>管理团队</h2>
                        <p>为玩家提供最优质的游戏体验</p>
                    </div>
                </div>

                <div class="cards">

                    <div class="card">
                        <div class="meta">
                            <span>服务器管理员</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
                            <img src="images/staff/rmanagarmr.png" alt="RManagarmr"
                                style="width: 48px; height: 48px; border-radius: 50%;">
                            <h3 style="margin: 0;">RManagarmr</h3>
                        </div>
                        <p class="desc">负责服务器日常运营与维护。</p>
                    </div>

                    <div class="card">
                        <div class="meta">
                            <span>技术支持</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
                            <img src="images/staff/mcxiaocai666.png" alt="Mcxiaocai666"
                                style="width: 48px; height: 48px; border-radius: 50%;">
                            <h3 style="margin: 0;">Mcxiaocai666</h3>
                        </div>
                        <p class="desc">提供技术援助与问题解决。</p>
                    </div>

                    <div class="card">
                        <div class="meta">
                            <span>社区协调员</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
                            <img src="images/staff/tanzeus.png" alt="Tanzeus"
                                style="width: 48px; height: 48px; border-radius: 50%;">
                            <h3 style="margin: 0;">Tanzeus</h3>
                        </div>
                        <p class="desc">负责社区活动与玩家互动。</p>
                    </div>

                    <div class="card">
                        <h3>加入我们</h3>
                        <p class="desc">我们始终在寻找有热情、有能力的玩家加入管理团队。</p>
                        <a href="#" class="btn btn-secondary">申请加入</a>
                    </div>

                </div>

                <div class="footer">
                    <div class="copyright">Copyright © 2025 AzureDream All rights reserved.</div>
