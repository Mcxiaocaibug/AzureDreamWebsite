<body>
    <a href="#main-content" class="skip-link">跳转到主内容</a>
    <!-- SVG Filter for Liquid Glass Effect -->
    <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
        <filter id="glass-distortion" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox">
            <feTurbulence type="fractalNoise" baseFrequency="0.001 0.005" numOctaves="1" seed="17" result="turbulence" />
            <feComponentTransfer in="turbulence" result="mapped">
                <feFuncR type="gamma" amplitude="1" exponent="10" offset="0.5" />
                <feFuncG type="gamma" amplitude="0" exponent="1" offset="0" />
                <feFuncB type="gamma" amplitude="0" exponent="1" offset="0.5" />
            </feComponentTransfer>
            <feGaussianBlur in="turbulence" stdDeviation="3" result="softMap" />
            <feSpecularLighting in="softMap" surfaceScale="5" specularConstant="1" specularExponent="100" lighting-color="white" result="specLight">
                <fePointLight x="-200" y="-200" z="300" />
            </feSpecularLighting>
            <feComposite in="specLight" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litImage" />
            <feDisplacementMap in="SourceGraphic" in2="softMap" scale="200" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>
    
    <div class="blur-overlay"></div>
    <nav class="glass-nav liquid-glass liquid-glass--static" role="navigation" aria-label="主导航">
        <div class="nav-content">
            <div class="logo">

            <div class="nav-links liquidGlass-wrapper dock">

            </div>

                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <main id="main-content" class="staff-container" role="main">

        </section>

        <section class="staff-hierarchy">
            <h2 class="section-title animate-on-scroll">管理团队</h2>
            <div class="staff-grid">
                <div class="staff-card liquidGlass-wrapper animate-on-scroll">
                    <div class="staff-avatar">
                        <img src="images/staff/rmanagarmr.png" alt="RManagarmr" width="120" height="120" loading="lazy" decoding="async">
                    </div>
                    <h3>RManagarmr</h3>
                    <p class="staff-title">服务器管理员</p>
                    <p class="staff-description">负责服务器日常运营与维护</p>
                </div>

                <div class="staff-card liquidGlass-wrapper animate-on-scroll">
                    <div class="staff-avatar">
                        <img src="images/staff/mcxiaocai666.png" alt="Mcxiaocai666" width="120" height="120" loading="lazy" decoding="async">
                    </div>
                    <h3>Mcxiaocai666</h3>
                    <p class="staff-title">技术支持</p>
                    <p class="staff-description">提供技术援助与问题解决</p>
                </div>

                <div class="staff-card liquidGlass-wrapper animate-on-scroll">
                    <div class="staff-avatar">
                        <img src="images/staff/tanzeus.png" alt="Tanzeus" width="120" height="120" loading="lazy" decoding="async">

                </div>

        </section>

        <section class="join-staff animate-on-scroll liquidGlass-wrapper">
            <h2>加入我们</h2>
            <p>我们始终在寻找有热情、有能力的玩家加入管理团队</p>
            <a href="#" class="apply-btn liquidGlass-wrapper button">申请成为管理团队</a>
